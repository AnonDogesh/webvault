name: Build and Release APK

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle', '**/*.gradle.kts', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build release APK
        run: ./gradlew assembleRelease

      - name: Check signing secrets
        id: signing
        env:
          KEYSTORE_FILE: ${{ secrets.KEYSTORE_FILE }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_FILE" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ] && [ -n "$STORE_PASSWORD" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Signing secrets are unavailable; continuing with unsigned APK only."
          fi

      - name: Decode keystore
        if: steps.signing.outputs.enabled == 'true'
        env:
          KEYSTORE_FILE: ${{ secrets.KEYSTORE_FILE }}
        run: |
          # KEYSTORE_FILE must be base64 of the raw keystore bytes
          printf '%s' "$KEYSTORE_FILE" | base64 --decode > /tmp/webvault.keystore

          if [ ! -s /tmp/webvault.keystore ]; then
            echo "Decoded keystore is empty. Verify KEYSTORE_FILE base64 value."
            exit 1
          fi

      - name: Sign APK
        if: steps.signing.outputs.enabled == 'true'
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEYSTORE_TYPE: ${{ secrets.KEYSTORE_TYPE }}
        run: |
          UNSIGNED_APK="$(find app/build/outputs/apk/release -name '*-unsigned.apk' | head -n 1)"
          SIGNED_APK="app/build/outputs/apk/release/app-release-signed.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)"

          if [ -z "$UNSIGNED_APK" ]; then
            echo "Unsigned APK not found"
            exit 1
          fi

          if [ -z "$APKSIGNER" ]; then
            echo "apksigner not found"
            exit 1
          fi

          KS_TYPE="${KEYSTORE_TYPE:-JKS}"

          "$APKSIGNER" sign \
            --ks /tmp/webvault.keystore \
            --ks-type "$KS_TYPE" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass pass:"$STORE_PASSWORD" \
            --key-pass pass:"$KEY_PASSWORD" \
            --out "$SIGNED_APK" \
            "$UNSIGNED_APK"

      - name: Upload unsigned APK artifact
        if: steps.signing.outputs.enabled != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Webvault-release-unsigned.apk
          path: app/build/outputs/apk/release/*-unsigned.apk
          retention-days: 7

      - name: Upload signed APK artifact
        if: steps.signing.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Webvault-release.apk
          path: app/build/outputs/apk/release/app-release-signed.apk
          retention-days: 7

      - name: Create GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.signing.outputs.enabled == 'true'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ github.run_number }}
          name: Webvault Release ${{ github.run_number }}
          files: app/build/outputs/apk/release/app-release-signed.apk
