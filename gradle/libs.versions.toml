[versions]
kotlin = "2.0.21"
compose-compiler = "2.0.21"
agp = "8.7.0"

[libraries]
androidx-core-ktx = "androidx.core:core-ktx:1.13.1"
androidx-lifecycle-runtime-ktx = "androidx.lifecycle:lifecycle-runtime-ktx:2.8.6"
androidx-activity-compose = "androidx.activity:activity-compose:1.9.2"
androidx-compose-bom = "androidx.compose:compose-bom:2024.09.03"
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
androidx-compose-material = "androidx.compose.material:material:1.6.8"
androidx-work-runtime-ktx = "androidx.work:work-runtime-ktx:2.9.1"
androidx-security-crypto = "androidx.security:security-crypto:1.1.0-alpha06"
androidx-biometric-ktx = "androidx.biometric:biometric-ktx:1.2.0-alpha05"
okhttp = "com.squareup.okhttp3:okhttp:4.12.0"
kotlinx-coroutines-android = "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1"
androidx-datastore-preferences = "androidx.datastore:datastore-preferences:1.1.1"
androidx-room-runtime = "androidx.room:room-runtime:2.6.1"
androidx-room-ktx = "androidx.room:room-ktx:2.6.1"
androidx-room-compiler = "androidx.room:room-compiler:2.6.1"
androidx-lifecycle-viewmodel-compose = "androidx.lifecycle:lifecycle-viewmodel-compose:2.8.6"
junit = "junit:junit:4.13.2"
androidx-test-ext-junit = "androidx.test.ext:junit:1.2.1"
androidx-espresso-core = "androidx.test.espresso:espresso-core:3.6.1"
androidx-compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "compose-compiler" }
ksp = { id = "com.google.devtools.ksp", version = "2.0.21-1.0.27" }
